<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal Sift</title>
  <script>
    // Inherit the app's chosen theme (same key the dashboard uses). Defaults to Midnight.
    document.documentElement.dataset.theme = localStorage.getItem("ss-theme") || "midnight";
  </script>
  <style>
    /* Five themes — kept in step with static/styles.css. */
    :root, :root[data-theme="midnight"], :root[data-theme="dark"] {
      --bg:#0e1116; --panel2:#1c2230; --line:#2a3140; --text:#e6edf3; --muted:#8b96a5; --accent:#4c9aff;
    }
    :root[data-theme="carbon"] { --bg:#101011; --panel2:#212123; --line:#333336; --text:#ededed; --muted:#9a9a9e; --accent:#c9a227; }
    :root[data-theme="light"]  { --bg:#f5f7fa; --panel2:#eef1f6; --line:#d7dde6; --text:#1a2230; --muted:#667085; --accent:#2563eb; }
    :root[data-theme="amber"]  { --bg:#0b0a06; --panel2:#1c1810; --line:#352c18; --text:#ffd68a; --muted:#b7965a; --accent:#ffb000; }
    :root[data-theme="ocean"]  { --bg:#071417; --panel2:#12292e; --line:#1e3a41; --text:#d6f0ee; --muted:#79a2a4; --accent:#22d3c5; }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }

    .stage {
      position: fixed; inset: 0;
      background: radial-gradient(70% 60% at 50% 46%, var(--panel2) 0%, var(--bg) 60%, var(--bg) 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px;
    }
    .lockup { display: flex; align-items: center; justify-content: center; gap: clamp(14px, 3vw, 26px); }

    /* The ◑ mark: a ring; a pie sweep spins in and fills the right half. */
    .mark {
      --sz: clamp(46px, 11vw, 82px);
      position: relative; flex: none; width: var(--sz); height: var(--sz);
      border-radius: 50%; overflow: hidden;
      border: 3px solid var(--accent); box-shadow: 0 0 22px -2px var(--accent);
      opacity: 0; animation: appear 520ms ease-out forwards;
    }
    @keyframes appear { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
    .sweep { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .prog {
      fill: none; stroke: var(--accent); stroke-width: 19;
      stroke-dasharray: 56.549; stroke-dashoffset: 56.549;
    }
    .mark.load .sweep { animation: spin 1300ms cubic-bezier(.3,.45,.2,1) forwards; }
    .mark.load .prog  { animation: fillup 1300ms cubic-bezier(.3,.45,.2,1) forwards; }
    @keyframes spin { from { transform: rotate(-450deg); } to { transform: rotate(-90deg); } }
    @keyframes fillup { from { stroke-dashoffset: 56.549; } to { stroke-dashoffset: 28.274; } }

    .word {
      display: inline-flex; align-items: center; margin: 0;
      font-weight: 600; letter-spacing: .5px; font-size: clamp(30px, 8vw, 62px); white-space: nowrap;
    }
    .caret {
      display: inline-block; width: 2px; height: 1em; margin-left: 3px;
      background: var(--accent); vertical-align: -.08em; animation: blink 1s steps(1) infinite;
    }
    .caret.done { animation: fadeout 420ms ease forwards; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes fadeout { to { opacity: 0; } }

    .sub {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      opacity: 0; transform: translateY(6px); transition: opacity .7s ease, transform .7s ease;
    }
    .sub.on { opacity: 1; transform: none; }
    .tag { margin: 0; color: var(--muted); font-size: clamp(11px, 2.6vw, 13px); letter-spacing: 3px; text-transform: uppercase; }
    .enter {
      color: var(--text); text-decoration: none; font-size: 14px; letter-spacing: 1px;
      padding: 9px 20px; border: 1px solid var(--line); border-radius: 999px;
      transition: border-color .15s, background .15s, color .15s;
    }
    .enter:hover, .enter:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
    .enter .arw { color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      .mark { animation: none; opacity: 1; }
      .sweep { animation: none !important; }
      .prog { stroke-dashoffset: 28.274; animation: none !important; }
      .caret { animation: none; opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="lockup">
      <span class="mark" id="mark" aria-hidden="true">
        <svg class="sweep" viewBox="0 0 36 36"><circle class="prog" cx="18" cy="18" r="9"></circle></svg>
      </span>
      <h1 class="word"><span id="typed"></span><span class="caret" id="caret" aria-hidden="true"></span></h1>
    </div>
    <div class="sub" id="sub">
      <p class="tag">S&amp;P 500 Trend Radar</p>
      <a class="enter" id="enter" href="/">Enter <span class="arw">&rarr;</span></a>
    </div>
  </div>

  <script>
    (function () {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var name = "Signal Sift";
      var mark = document.getElementById("mark");
      var typed = document.getElementById("typed");
      var caret = document.getElementById("caret");
      var sub = document.getElementById("sub");

      function land() { caret.classList.add("done"); sub.classList.add("on"); }

      if (reduce) {
        typed.textContent = name;
        land();
      } else {
        var i = 0;
        function type() {
          if (i >= name.length) { setTimeout(land, 500); return; }
          typed.textContent += name[i++];
          setTimeout(type, name[i - 1] === " " ? 150 : 82 + Math.random() * 45);
        }
        // ring appears (520ms) -> sweep spins + fills to half (1300ms) -> name types.
        setTimeout(function () { mark.classList.add("load"); }, 520);
        setTimeout(type, 1980);
      }
    })();
  </script>
</body>
</html>
